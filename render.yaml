# Render Blueprint: one Node web service that serves the game and the multiplayer WebSocket rooms.
# Render provides HTTPS (needed for the installable PWA) and wss:// for multiplayer automatically.
services:
  - type: web
    name: power-booster-gp
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # payments (docs/PAYMENTS.md): sync: false means you type the values in the Render dashboard
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
