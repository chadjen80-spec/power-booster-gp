# Builds the Android app (APK) on every push to main, or by hand from the Actions tab.
# Download it from the "Android (latest)" release, or from the run's artifacts.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # publish the APK to the "Android (latest)" release

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install ImageMagick (launcher icons)
        run: command -v convert || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)

      - name: Build web bundle
        run: bash scripts/build-www.sh

      - name: Create Android project
        run: bash scripts/setup-android.sh

      # Android only installs an update over the old app when both are signed with the same key.
      # Optional: save a debug keystore (base64) as the repository secret ANDROID_DEBUG_KEYSTORE_B64 and every
      # build reuses it. Without the secret each build gets a fresh key, so uninstall the old app before updating.
      - name: Signing key (optional secret)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using the saved signing key"
          else
            echo "No ANDROID_DEBUG_KEYSTORE_B64 secret: using a one-off key for this build"
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../PowerBoosterGP.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PowerBoosterGP-apk
          path: PowerBoosterGP.apk

      - name: Remove the previous APK from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset android-latest PowerBoosterGP.apk --yes || true

      - name: Publish to the "Android (latest)" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android (latest)
          prerelease: true
          make_latest: false
          body: |
            Latest Android build of Power Booster GP (commit ${{ github.sha }}).
            Download PowerBoosterGP.apk on your phone and open it to install.
          files: PowerBoosterGP.apk
